[project]
name = "payments-agent-mcp"
version = "0.1.0"
description = "MCP server, support agent and evals over a synthetic payments sandbox"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Kudzai Mupita", email = "67244898+kudzaimupita@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "cryptography>=50.0.2",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
payments-sandbox = "payments_agent.cli:main"
payments-mcp = "payments_agent.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payments_agent"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["payments_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
